<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face audit · flags</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .wrap { flex:1; display:grid; grid-template-columns:280px 1fr; min-height:0; }
  aside { border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  aside header { padding:12px; border-bottom:1px solid var(--line); }
  #status { font-size:12px; color:var(--muted); }
  #groups { overflow-y:auto; flex:1; }
  .kind { padding:10px 12px 4px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .g { padding:5px 12px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; border-left:3px solid transparent; }
  .g:hover, .g.on { background:var(--sel); }
  .g.on { border-left-color:var(--accent); }
  .g .c { color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; white-space:nowrap; }
  .g.done .n::before { content:"✓ "; color:var(--ok); }
  main { overflow-y:auto; padding:16px 20px 60px; min-width:0; }
  main > header { margin-bottom:12px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .groupbar { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  #cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:10px; }
  .card2 { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px; display:grid; grid-template-columns:128px 1fr; gap:8px; outline:2px solid transparent; }
  .card2.cur { outline-color:var(--accent); }
  .card2.accept { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 10%, var(--panel)); }
  .card2.keep { opacity:.55; }
  .card2.unassign { border-color:var(--warn); background:color-mix(in srgb, var(--warn) 10%, var(--panel)); }
  .card2 .f { cursor:zoom-in; }
  .refs { display:flex; flex-direction:column; gap:4px; font-size:11px; }
  .ref { display:grid; grid-template-columns:52px 1fr; gap:6px; align-items:center; }
  .ref b { display:block; font-size:12px; }
  .ref .sc { color:var(--muted); font-variant-numeric:tabular-nums; }
  .ref.sug b { color:var(--ok); }
  .meta { grid-column:1 / -1; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--muted); }
  .acts { display:flex; gap:4px; }
  .acts button { padding:1px 7px; font-size:12px; }
  .verdict { font-weight:600; }
  .accept .verdict { color:var(--ok); } .unassign .verdict { color:var(--warn); }
  .bar { display:flex; align-items:center; gap:10px; padding:8px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  .bar .sp { flex:1; }
</style>
</head>
<body>
<nav id="steps"></nav>
<div class="bar">
  <span class="help"><b>y</b> = give to the suggestion · <b>n</b> = correct, keep · <b>u</b> = remove the person · <b>space</b> = clear ·
    <b>← →</b> card · <b>j / k</b> group · click a face = open in Immich</span>
  <span class="sp"></span>
  <span id="scoreMsg" class="help"></span>
  <button id="score">Recompute flags</button>
  <button id="next" class="primary">Next: apply →</button>
</div>
<div class="wrap">
<aside>
  <header><div id="status"></div></header>
  <div id="groups"></div>
</aside>
<main>
  <header>
    <h1 id="title"></h1>
    <div class="help">Large face = flagged face. Right: a validated reference of each person from the same period.
      Nothing changes in Immich until step 5.</div>
    <div class="groupbar">
      <button id="allAccept">Whole group → suggestion</button>
      <button id="allKeep">Whole group → keep</button>
      <button id="allUnassign">Whole group → remove</button>
    </div>
  </header>
  <div id="cards"></div>
</main>
</div>
<script src="/static/app.js"></script>
<script>
const { el, get, post, steps, runJob, crop: faceCrop } = FA;
const LABEL = { swap: "Wrong person?", "before-birth": "Before birth date", twice: "Tagged twice in one photo",
                "not-them": "Looks like nobody", suggest: "Unnamed → suggestion" };
const VERB = { accept: "→ suggestion", keep: "keep", unassign: "remove" };
let GROUPS = [], dec = {}, cur = 0, card = 0, immich = "", timer = null;
const $ = s => document.querySelector(s);

function crop(f, D) {
  const box = faceCrop(f, D);
  box.onclick = () => window.open(`${immich}/photos/${f[1]}`, "_blank");
  return box;
}

function refRow(r, who, score, sug) {
  const row = el("div", "ref" + (sug ? " sug" : ""));
  row.append(r ? crop(r, 52) : el("div", "f"));
  const t = el("div");
  t.append(el("b", null, who), el("span", "sc", score ? `score ${score}` : "—"));
  if (r) t.append(el("div", "sc", r[8].slice(0, 7)));
  row.append(t);
  return row;
}

const title = g => g.reason === "suggest" ? `→ ${g.s}` : `${g.a}${g.s !== "—" ? " → " + g.s : ""}`;

function renderList() {
  const box = $("#groups"); box.replaceChildren();
  let last = "";
  GROUPS.forEach((g, i) => {
    if (g.reason !== last) { box.append(el("div", "kind", LABEL[g.reason])); last = g.reason; }
    const n = g.cards.filter(c => dec[c.face[0]]).length;
    const row = el("div", "g" + (i === cur ? " on" : "") + (n === g.cards.length ? " done" : ""));
    row.append(el("span", "n", title(g)), el("span", "c", `${n}/${g.cards.length}`));
    row.onclick = () => show(i);
    box.append(row);
  });
  const all = GROUPS.reduce((a, g) => a + g.cards.length, 0);
  const flagged = new Set(GROUPS.flatMap(g => g.cards.map(c => c.face[0])));
  const cnt = { accept: 0, keep: 0, unassign: 0 };
  Object.values(dec).forEach(v => { if (flagged.has(v.face)) cnt[v.action]++; });
  $("#status").textContent = `${cnt.accept + cnt.keep + cnt.unassign}/${all} decided · ${cnt.accept} reassign · ${cnt.unassign} remove · ${cnt.keep} keep`;
}

function paint(node, c) {
  const d = dec[c.face[0]];
  node.classList.remove("accept", "keep", "unassign");
  if (d) node.classList.add(d.action);
  node.querySelector(".verdict").textContent = d ? VERB[d.action] : "";
}

function show(i, keepCard) {
  if (!GROUPS.length) return;
  cur = Math.max(0, Math.min(GROUPS.length - 1, i));
  if (!keepCard) card = 0;
  const g = GROUPS[cur];
  $("#title").textContent = `${LABEL[g.reason]} · ${title(g)} · ${g.cards.length}`;
  $("#allAccept").disabled = g.s === "—";
  const box = $("#cards"); box.replaceChildren();
  g.cards.forEach((c, k) => {
    const node = el("div", "card2" + (k === card ? " cur" : ""));
    node.append(crop(c.face, 128));
    const refs = el("div", "refs");
    if (c.aName) refs.append(refRow(c.aRef, c.aName + " (tagged)", c.aScore, false));
    if (c.sName) refs.append(refRow(c.sRef, c.sName, c.sScore, true));
    node.append(refs);
    const meta = el("div", "meta");
    meta.append(el("span", null, c.date), el("span", "verdict"));
    const acts = el("div", "acts");
    [["accept", "✓", !c.s], ["keep", "=", !c.a], ["unassign", "✕", !c.a]].forEach(([a, t, off]) => {
      const b = el("button", null, t); b.title = VERB[a]; b.disabled = off;
      b.onclick = () => { card = k; decide(a); };
      acts.append(b);
    });
    meta.append(acts); node.append(meta);
    paint(node, c); box.append(node);
  });
  if (!keepCard) $("main").scrollTop = 0;
  renderList();
}

function decide(action, k = card) {
  const c = GROUPS[cur].cards[k];
  if (!c || (action === "accept" && !c.s) || (action && action !== "accept" && !c.a)) return;
  if (!action) delete dec[c.face[0]];
  else dec[c.face[0]] = { action, face: c.face[0], asset: c.face[1], from: c.a, to: action === "accept" ? c.s : null,
                           fromName: c.aName, toName: action === "accept" ? c.sName : null, reason: c.reason };
  paint($("#cards").children[k], c);
  save(); renderList();
}

function move(d) {
  const nodes = $("#cards").children;
  nodes[card]?.classList.remove("cur");
  card = Math.max(0, Math.min(nodes.length - 1, card + d));
  nodes[card]?.classList.add("cur");
  nodes[card]?.scrollIntoView({ block: "nearest" });
}

function save(now) {
  clearTimeout(timer);
  const doSave = () => { timer = null; return post("/audit/state/decisions", dec).catch(e => $("#status").textContent = "⚠ save failed: " + e.message); };
  if (now) return doSave();
  timer = setTimeout(doSave, 300);
}

const all = action => GROUPS[cur].cards.forEach((_, k) => decide(action, k));
$("#allAccept").onclick = () => all("accept");
$("#allKeep").onclick = () => all("keep");
$("#allUnassign").onclick = () => all("unassign");
document.addEventListener("keydown", e => {
  const k = e.key;
  if (k === "y") { decide("accept"); move(1); }
  else if (k === "n") { decide("keep"); move(1); }
  else if (k === "u") { decide("unassign"); move(1); }
  else if (k === " ") { e.preventDefault(); decide(null); }
  else if (k === "ArrowRight") move(1);
  else if (k === "ArrowLeft") move(-1);
  else if (k === "j") show(cur + 1);
  else if (k === "k") show(cur - 1);
});
window.addEventListener("beforeunload", () => { if (timer) save(true); });
$("#next").onclick = async () => { await save(true); location.href = "/apply"; };
$("#score").onclick = async () => {
  const b = $("#score"); b.disabled = true;
  try {
    await save(true);
    const j = await runJob("score", {}, j => $("#scoreMsg").textContent = "scoring… " + (j.log.at(-1) || ""));
    if (j.state === "done") location.reload();
    else { $("#scoreMsg").textContent = "⚠ " + j.error; b.disabled = false; }
  } catch (e) { $("#scoreMsg").textContent = "⚠ " + e.message; b.disabled = false; }
};

(async () => {
  const s = await steps("flags");
  immich = (await get("/audit/config")).immich;
  dec = await get("/audit/state/decisions");
  GROUPS = await get("/audit/flags");
  if (!GROUPS) {
    GROUPS = [];
    $("#cards").replaceChildren(el("div", "empty", "No flags yet: validate the references (step 3), then press “Compute flags”."));
    return;
  }
  if (s.flagsStale) $("#cards").before(el("div", "banner", "The references changed since these flags were computed: press “Recompute flags”. Your decisions are kept."));
  show(0);
})();
</script>
</body>
</html>
