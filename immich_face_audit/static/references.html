<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face audit · references</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .wrap { flex:1; display:grid; grid-template-columns:250px 1fr; min-height:0; }
  aside { border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  aside header { padding:12px; border-bottom:1px solid var(--line); }
  #status { font-size:12px; color:var(--muted); margin-top:6px; }
  #people { overflow-y:auto; flex:1; }
  .p { padding:6px 12px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; border-left:3px solid transparent; }
  .p:hover, .p.on { background:var(--sel); }
  .p.on { border-left-color:var(--accent); }
  .p .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .p .c { color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; white-space:nowrap; }
  .p.done .n::before { content:"✓ "; color:var(--ok); }
  .rej { color:var(--bad); }
  main { overflow-y:auto; padding:16px 20px 60px; min-width:0; }
  main > header { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:8px; }
  h1 { font-size:22px; margin:0; }
  section { margin-top:18px; }
  section h2 { font-size:13px; font-weight:600; margin:0 0 6px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .grid { display:flex; flex-wrap:wrap; gap:4px; }
  .grid .f { cursor:pointer; }
  .grid .f.x { outline:3px solid var(--bad); outline-offset:-3px; }
  .grid .f.x img { opacity:.35; }
  .grid .f.x::after { content:"✕"; position:absolute; inset:0; display:grid; place-items:center; color:var(--bad); font-size:40px; font-weight:700; }
  .grid .f .d { position:absolute; left:0; right:0; bottom:0; font-size:10px; padding:1px 4px; color:#fff; background:linear-gradient(transparent, rgba(0,0,0,.7)); }
  .bar { display:flex; align-items:center; gap:10px; padding:8px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  .bar .sp { flex:1; }
</style>
</head>
<body>
<nav id="steps"></nav>
<div class="bar">
  <span class="help">Reject any face that isn't the person. People who look most like someone else come first; in each period the least consistent faces are last.
    click = reject / restore · shift-click = open in Immich · j / k = next / previous person</span>
  <span class="sp"></span>
  <span id="scoreMsg" class="help"></span>
  <button id="score" class="primary">Compute flags →</button>
</div>
<div class="wrap">
<aside>
  <header>
    <input id="q" type="text" placeholder="Filter…" autocomplete="off">
    <div id="status">loading…</div>
  </header>
  <div id="people"></div>
</aside>
<main>
  <header><h1 id="who"></h1><button id="done"></button></header>
  <div id="windows"></div>
</main>
</div>
<script src="/static/app.js"></script>
<script>
const { el, get, post, steps, runJob, crop: faceCrop } = FA;
let PEOPLE = [], state = { rejected: {}, reviewed: {} }, cur = 0, immich = "", saveTimer = null;
const $ = s => document.querySelector(s);

function counts(p) {
  let n = 0, x = 0;
  for (const w of p.windows) for (const r of w.refs) { n++; if (state.rejected[r[0]]) x++; }
  return [n, x];
}

function renderList() {
  const q = $("#q").value.toLowerCase(), box = $("#people");
  box.replaceChildren();
  PEOPLE.forEach((p, i) => {
    if (q && !p.name.toLowerCase().includes(q)) return;
    const [n, x] = counts(p);
    const row = el("div", "p" + (i === cur ? " on" : "") + (state.reviewed[p.id] ? " done" : ""));
    const c = el("span", "c", `${n}`);
    if (x) c.append(el("span", "rej", ` −${x}`));
    row.append(el("span", "n", p.name), c);
    row.onclick = () => show(i);
    box.append(row);
  });
  const total = PEOPLE.reduce((a, p) => a + counts(p)[0], 0);
  $("#status").textContent = `${Object.keys(state.reviewed).length}/${PEOPLE.length} people reviewed · ${Object.keys(state.rejected).length} rejected / ${total}`;
}

function crop(r) {
  const [fid, aid, , , , , , , date, score] = r;
  const box = faceCrop(r, 96);
  if (state.rejected[fid]) box.classList.add("x");
  box.title = `${date} · consistency ${score.toFixed(3)}`;
  box.append(el("span", "d", date.slice(0, 7)));
  box.onclick = e => {
    if (e.shiftKey) { window.open(`${immich}/photos/${aid}`, "_blank"); return; }
    if (state.rejected[fid]) delete state.rejected[fid]; else state.rejected[fid] = 1;
    box.classList.toggle("x", !!state.rejected[fid]);
    save(); renderList();
  };
  return box;
}

function show(i) {
  if (!PEOPLE.length) return;
  cur = Math.max(0, Math.min(PEOPLE.length - 1, i));
  const p = PEOPLE[cur];
  $("#who").textContent = p.name;
  $("#done").textContent = state.reviewed[p.id] ? "Reviewed ✓ (undo)" : "Mark reviewed";
  const box = $("#windows"); box.replaceChildren();
  for (const w of p.windows) {
    const s = el("section");
    s.append(el("h2", null, `${w.start}–${w.start + 2} · ${w.refs.length} references of ${w.total} faces`));
    const g = el("div", "grid"); w.refs.forEach(r => g.append(crop(r)));
    s.append(g); box.append(s);
  }
  $("main").scrollTop = 0;
  renderList();
}

function save(now) {
  clearTimeout(saveTimer);
  const doSave = () => post("/audit/state/rejections", state).catch(e => $("#status").textContent = "⚠ save failed: " + e.message);
  if (now) return doSave();
  saveTimer = setTimeout(doSave, 300);
}

$("#done").onclick = () => {
  const id = PEOPLE[cur].id;
  if (state.reviewed[id]) delete state.reviewed[id]; else state.reviewed[id] = 1;
  save(); show(state.reviewed[id] ? cur + 1 : cur);
};
$("#score").onclick = async () => {
  const b = $("#score"); b.disabled = true;
  try {
    await save(true);
    const j = await runJob("score", {}, j => $("#scoreMsg").textContent = "scoring every face… " + (j.log.at(-1) || ""));
    if (j.state === "done") location.href = "/flags";
    else { $("#scoreMsg").textContent = "⚠ " + j.error; b.disabled = false; }
  } catch (e) { $("#scoreMsg").textContent = "⚠ " + e.message; b.disabled = false; }
};
$("#q").oninput = renderList;
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "j") show(cur + 1);
  if (e.key === "k") show(cur - 1);
});
window.addEventListener("beforeunload", () => { if (saveTimer) save(true); });

(async () => {
  const s = await steps("references");
  immich = (await get("/audit/config")).immich;
  state = Object.assign(state, await get("/audit/state/rejections"));
  PEOPLE = await get("/audit/references");
  if (!PEOPLE.length) {
    $("#windows").replaceChildren(el("div", "empty", s.data ? "No references yet: build them in step 2." : "Get the data first (step 2)."));
    $("#score").disabled = true;
    return;
  }
  if (s.referencesStale) $("#windows").before(el("div", "banner", "These references are older than the data. Rebuild them in step 2."));
  show(0);
})();
</script>
</body>
</html>
